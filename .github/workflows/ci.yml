name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um novo push na mesma branch cancela a execução anterior ainda em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Este nome é o "status check" exigido pela proteção da main —
    # se mudar aqui, atualize em Settings → Branches.
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Valores fictícios: o build não conecta ao banco nem ao Clerk, mas o
    # prisma.config.ts, o app/_lib/prisma.ts e o Clerk exigem que existam.
    # Nada aqui é segredo — os valores reais ficam só na Vercel.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci
      CRON_SECRET: ci
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Roda o postinstall (prisma generate). HUSKY=0 evita instalar os git hooks.
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
